name: .NET Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: .NET / build (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DSHSharp.slnx
      - name: Test
        run: dotnet test DSHSharp.slnx --configuration ${{ matrix.configuration }} --no-restore --verbosity normal
      - name: Build
        run: dotnet build DSHSharp.slnx --configuration ${{ matrix.configuration }} --no-restore --warnaserror
      - name: Publish Windows package
        if: matrix.configuration == 'Release'
        run: dotnet publish src/DSHSharp/DSHSharp.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/ci/windows-x64 --no-restore
      - name: Upload Windows package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-sharp-windows-x64
          path: artifacts/ci/windows-x64

  plugin:
    name: Session plugin / test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Enable pnpm
        run: corepack enable
      - name: Test session plugin
        working-directory: plugins/dsh-sharp-session
        run: pnpm install --frozen-lockfile; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; pnpm test
