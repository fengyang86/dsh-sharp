name: .NET Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: .NET / build (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DSHSharp.slnx
      - name: Test
        run: dotnet test DSHSharp.slnx --configuration ${{ matrix.configuration }} --no-restore --verbosity normal
      - name: Build
        run: dotnet build DSHSharp.slnx --configuration ${{ matrix.configuration }} --no-restore --warnaserror
      - name: Publish Windows package
        if: matrix.configuration == 'Release'
        run: dotnet publish src/DSHSharp/DSHSharp.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64 --self-contained true --output artifacts/ci/windows-x64 --no-restore
      - name: Build Windows installer
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/DSHSharp.Core/Compatibility/DshSharpCompatibility.cs -Pattern 'ProductVersion = "([^"]+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" }
          & $iscc packaging/windows/dshsharp.iss /DAppVersion=$ver "/DPayloadDir=$env:GITHUB_WORKSPACE\artifacts\ci\windows-x64" "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts\ci\installer"
      - name: Upload Windows package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-sharp-windows-x64
          path: |
            artifacts/ci/windows-x64
            artifacts/ci/installer

  plugin:
    name: Session plugin / test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Enable pnpm
        run: corepack enable
      - name: Test session plugin
        working-directory: plugins/dsh-sharp-session
        run: pnpm install --frozen-lockfile; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; pnpm test
